services:
  cassandra:
    image: cassandra:5.0
    container_name: youtube-cassandra
    ports: ["9042:9042"]
    environment:
      CASSANDRA_CLUSTER_NAME: youtube-demo
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes: [cassandra_data:/var/lib/cassandra]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' 127.0.0.1 9042"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
  api:
    build: .
    container_name: youtube-cassandra-api
    environment:
      CASSANDRA_HOSTS: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE: youtube_nosql
      COMMENT_SHARDS: 4
      LIKE_SHARDS: 16
    ports: ["8000:8000"]
    depends_on:
      cassandra:
        condition: service_healthy
    restart: unless-stopped
volumes:
  cassandra_data:
