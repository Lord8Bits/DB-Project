# ---------------------------------------------------------------
# Redis server settings for the YouTube replica
# ---------------------------------------------------------------

# --- Persistence: counters have no TTL, so they must survive a restart ---
# AOF (append-only file) logs every write; "everysec" = at most 1 second of
# writes can be lost on a crash. Good balance between safety and speed.
appendonly yes
appendfsync everysec

# RDB snapshots as a second safety net (every 15 min if >=1 change, etc.).
save 900 1
save 300 10
save 60 10000

# --- Memory: Redis is a cache + counter store, not an unbounded database ---
maxmemory 256mb

# volatile-lru: when memory is full, evict ONLY keys that have a TTL
# (least recently used first): cache:video:*, view sessions, like_seen.
# Keys WITHOUT a TTL (video:{id}:stats) are never evicted.
maxmemory-policy volatile-lru
